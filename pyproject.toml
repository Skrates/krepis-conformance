[project]
name = "krepis-conformance"
version = "0.1.0"
description = "Krepis kernel-family conformance suite (KRA-752 §10): pytest checks that pin the family standard so the six kernels cannot re-drift."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Hákon Freyr Gunnarsson" }]
keywords = ["conformance", "pytest", "event-sourcing", "krepis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
    "fastapi>=0.115.0",
    "fastapi-mcp>=0.4.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "ruff==0.15.21",
    "ty==0.0.57",
    "types-pyyaml>=6.0.12",
]

[project.urls]
Repository = "https://github.com/RationallyPrime/krepis-conformance"
Issues = "https://github.com/RationallyPrime/krepis-conformance/issues"

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/krepis_conformance"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ANN", "S", "N", "RUF", "SIM", "TCH", "PTH"]
ignore = [
    "ANN401",
    "B008",
    "N818",
    "RUF001",
    "RUF002",
    "S101",
    "TC001",
    "TC002",
    "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S101"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"

[tool.ty.environment]
python-version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
